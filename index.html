<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>단수달 🦦</title>
<meta name="author" content="@tteoboja_0" />
<meta name="copyright" content="© 2026 @tteoboja_0. All rights reserved." />
<style>
  :root {
    --ink: #3b2a1c;
    --muted: #8a7561;
    --paper: #fbf6ee;
    --card: #f3ead9;
    --line: #e0d2bd;
    --yarn: #3f7266;
    /* 캐릭터의 밝은 크림색(배·볼)이 --card 와 거의 같은 톤이라
       묻혔던 문제라, 카드보다 확실히 밝은 흰색 계열로 띄웁니다. */
    --stage-bg: #fffaf1;
    --zoom: 1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(16px, 5vw, 24px) clamp(14px, 5vw, 20px) 96px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  main { max-width: 420px; margin: 0 auto; }

  /* 실 교체 등으로 위 내용 높이가 바뀌어도 안내문·푸터는 화면
     아래에 고정해 흔들리지 않게 합니다. */
  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 10px clamp(14px, 5vw, 20px) 12px;
  }
  .bottom-bar-inner { max-width: 420px; margin: 0 auto; }
  .bottom-bar footer { margin-top: 0; padding-top: 0; border-top: none; }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .zoom-controls { display: flex; gap: 6px; flex: none; }
  .zoom-controls button {
    flex: none;
    width: 30px;
    height: 30px;
    min-width: 0;
    padding: 0;
    font-size: 16px;
    line-height: 1;
  }

  .stage-wrap {
    background: var(--stage-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: clamp(14px, 4vw, 20px);
    text-align: center;
  }
  #stage {
    width: min(calc(224px * var(--zoom)), 100%);
    image-rendering: pixelated;
    display: block;
    margin: 0 auto;
  }
  /* 화면에 보이지 않지만 스크린리더에는 읽히는 상태 문구.
     실제 화면 표시는 .speech-bubble 이 맡습니다. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  /* 캐릭터 위에 뜨는 말풍선. 픽셀아트 캔버스(32px)로는 자유 텍스트를
     그릴 방법이 없어서 HTML/CSS로 따로 띄우고, 색으로 평소 멘트와
     알림을 구분합니다. absolute 로 캔버스 위에 얹으면 확대 배율에
     따라 머리·귀와 겹칠 수 있어서, 일반 흐름에 놓아 캔버스를
     아래로 밀어내는 방식으로 겹침 자체를 없앱니다. */
  .speech-bubble {
    position: relative;
    display: inline-block;
    max-width: calc(100% - 28px);
    margin: 0 0 14px;
    padding: 6px 12px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(59, 42, 28, 0.08);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    overflow-wrap: break-word;
    transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
  }
  /* 꼬리를 삼각형 두 장 겹쳐서 만듭니다 — 아래(::before)는 테두리색으로
     한 칸 더 크게, 위(::after)는 배경색으로 그 안에 얹어 몸통의 테두리가
     꼬리까지 이어진 것처럼 보이게 합니다. 테두리 없이 배경색만 칠한
     삼각형 하나로는 카드 배경(--stage-bg)과 흰색이 거의 비슷해 꼬리가
     안 보이는 문제가 있었습니다. */
  .speech-bubble::before,
  .speech-bubble::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-style: solid;
  }
  .speech-bubble::before {
    bottom: -8px;
    border-width: 8px 8px 0;
    border-color: var(--line) transparent transparent;
  }
  .speech-bubble::after {
    bottom: -6px;
    border-width: 7px 7px 0;
    border-color: #fff transparent transparent;
  }
  .speech-bubble.kind-note {
    background: #eaf5f1;
    border-color: var(--yarn);
    color: var(--yarn);
  }
  .speech-bubble.kind-note::before { border-top-color: var(--yarn); }
  .speech-bubble.kind-note::after { border-top-color: #eaf5f1; }

  .progress { margin: 20px 0 16px; }
  .progress-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  /* 진행 그리드 — GitHub 잔디 컨셉을 캐릭터(수달)에 맞게, 칸 대신
     물고기 한 마리가 한 단. 뜬 단은 그 지점의 실 색(배색 이력)으로,
     아직 안 뜬 단은 옅은 색으로 표시합니다. 행/열 수와 칸 크기는
     목표 단수·화면 너비에 맞춰 main.js 가 계산해 인라인 스타일로
     넣어줍니다(고정 크기면 목표가 작을 때 그리드가 너무 작아 보임).
     칸이 그래도 넘치면 가로 스크롤 가능한 래퍼로 감쌉니다. */
  .row-grid-wrap {
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .row-grid {
    display: grid;
    /* grid-auto-flow 는 기본값 row — 왼쪽부터 채우다 한 줄이 차면
       다음 줄로, 일반 텍스트 줄바꿈과 같은 흐름입니다. 열 수·칸
       크기는 main.js 가 카드 너비에 맞춰 인라인 스타일로 넣습니다. */
    gap: 3px;
  }
  .row-cell {
    width: 100%;
    height: 100%;
    display: block;
    transition: color 160ms ease-out;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    min-width: 0;
  }
  .stat dt { font-size: 12px; color: var(--muted); margin: 0; }
  .stat dd {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: clamp(15px, 4.5vw, 19px);
    font-weight: 600;
    margin: 2px 0 0;
    white-space: nowrap;
  }
  .stat dd input[type="number"] {
    width: 3.4em;
    padding: 2px 4px;
    font: inherit;
    font-weight: 600;
    text-align: center;
  }
  /* .zoom-controls button 과 같은 30×30 정사각형 스타일 재사용. */
  .stat dd button {
    flex: none;
    width: 26px;
    height: 26px;
    min-width: 0;
    padding: 0;
    font-size: 15px;
    line-height: 1;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    flex: 1 1 auto;
    min-width: 88px;
    padding: 11px 14px;
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: transform 80ms ease-out, background-color 120ms ease-out;
  }
  button:hover { background: var(--card); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--yarn); outline-offset: 2px; }
  /* 기본 액션(한 단 뜨기) — 진한 색 배경 + 흰 글씨는 대비는 나쁘지
     않지만 카드 위주의 파스텔 톤 화면에서 혼자 튀어 보였습니다.
     연한 민트 배경 + 진한 초록 글씨로 바꿔 어느 화면에서도 또렷하게
     읽히면서 전체 톤과 어울리게 합니다. */
  #add {
    background: #e3f2ec;
    border: 2px solid var(--yarn);
    color: var(--yarn);
  }
  #add:hover { background: #d5ece3; }
  #wear { border-color: var(--yarn); color: var(--yarn); }
  #reset { color: var(--muted); }

  input[type="number"] {
    width: 88px;
    padding: 9px 10px;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  input:focus-visible { outline: 2px solid var(--yarn); outline-offset: 1px; }

  /* 실 창고 = 책장 선반 한 줄. 픽셀아트 톤에 맞춰 그레이디언트 없이
     flat 색 + 굵은 선반 판자 하나로만 단순하게 표현합니다. */
  .stash {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin: 0 0 16px;
  }
  .stash .hint { margin: 0 0 8px; }
  /* 한 줄에 맨 앞(최근) 1개 | 4개 | 4개를 구분선으로 나눠 담습니다. */
  .stash-grid {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 7px;
    padding-bottom: 10px;
    border-bottom: 4px solid #a3714a;
  }
  .swatch {
    flex: none;
    width: 30px;
    height: 30px;
    min-width: 0;
    padding: 0;
    border: 2px solid var(--ink);
    border-radius: 50%;
    background-repeat: no-repeat;
    /* 고양이 장난감 실타래처럼, 사선 세 줄을 가운데로 좁게 모아 겹칩니다. */
    background-image:
      linear-gradient(52deg, transparent 38%, rgba(0,0,0,.32) 38%, rgba(0,0,0,.32) 42%, transparent 42%),
      linear-gradient(52deg, transparent 48%, rgba(0,0,0,.32) 48%, rgba(0,0,0,.32) 52%, transparent 52%),
      linear-gradient(52deg, transparent 58%, rgba(0,0,0,.32) 58%, rgba(0,0,0,.32) 62%, transparent 62%);
  }
  .swatch.recent { border-color: var(--yarn); border-width: 3px; }
  .swatch:focus-visible { outline: 2px solid var(--yarn); outline-offset: 3px; }
  .stash-divider {
    flex: none;
    align-self: stretch;
    width: 1px;
    background: var(--line);
  }

  /* 단수 알림 패널 — 실 창고와 같은 카드 톤을 재사용합니다. */
  .notes {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin: 0 0 16px;
  }
  .notes .hint { margin: 0 0 8px; }
  /* 메모장에 일정을 한 줄씩 적어둔 느낌 — 낱개 카드 대신 점선으로 나눈
     리스트. 항목마다 박스를 두르지 않아 알림이 늘어도 답답하지 않다. */
  .notes-list {
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
  }
  .notes-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 2px;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .notes-list li:last-child { border-bottom: none; }
  .notes-list .note-text {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .notes-list .note-text::before {
    content: '· ';
    color: var(--muted);
  }
  .notes-list .note-actions { display: flex; gap: 0; flex: none; }
  .notes-list button {
    flex: none;
    width: 26px;
    height: 26px;
    min-width: 0;
    padding: 0;
    font-size: 13px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
  }
  .notes-list button:hover { background: #fff; color: var(--ink); }
  .note-type {
    display: flex;
    gap: 12px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .note-type label { display: flex; align-items: center; gap: 4px; }
  .note-fields {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .note-fields input[type="number"] { width: 70px; }
  .note-fields input[type="text"] { flex: 1 1 auto; min-width: 0; }
  /* 매 N단 반복의 시작~끝 구간 입력. 비워두면 1~총 단수로 취급됩니다. */
  .note-range input[type="number"] { flex: 1 1 auto; width: auto; min-width: 0; }
  .note-range-sep { color: var(--muted); flex: none; align-self: center; }
  /* .note-fields 의 display:flex 가 hidden 속성의 기본 display:none 을
     덮어쓰므로, id 선택자로 확실히 이깁니다. */
  #noteRange[hidden] { display: none; }
  .note-presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .note-presets button {
    flex: none;
    min-width: 0;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .note-form > .note-actions { display: flex; gap: 8px; }
  .note-form > .note-actions button { flex: none; min-width: 64px; }

  .hint { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  footer {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--yarn); }

  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }
</style>
</head>
<body>
<!-- 진행 그리드의 물고기 전부가 공유하는 클립 경로. 아래쪽 반을
     어둡게 칠하는 명암용 사각형을 이 모양으로 잘라내는 데 씁니다.
     body/tail 좌표는 main.js 의 makeFishCell() 과 반드시 맞춰야
     합니다 — 둘이 다르면 명암이 물고기 밖으로 삐져나옵니다. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="fishClip" clipPathUnits="userSpaceOnUse">
      <path d="M3,12 C3,6.2 9,5 13,6 C16,6.8 16.5,9.6 16.5,12 C16.5,14.4 16,17.2 13,18 C9,19 3,17.8 3,12 Z" />
      <polygon points="16,12 22,7 22,17" />
    </clipPath>
  </defs>
</svg>
<main>
  <div class="page-head">
    <h1>단수달 🦦</h1>
    <div class="zoom-controls">
      <button id="zoomOut" type="button" aria-label="캐릭터 작게 보기">−</button>
      <button id="zoomIn" type="button" aria-label="캐릭터 크게 보기">+</button>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="speech-bubble kind-chat" id="bubble">대기 중</div>
    <canvas id="stage" width="32" height="32"
            aria-label="뜨개질하는 수달 캐릭터"></canvas>
    <p id="status" class="sr-only" aria-live="polite">대기 중</p>
  </div>

  <div class="progress">
    <div class="progress-head">
      <span>진행</span><span id="percent">0%</span>
    </div>
    <div class="row-grid-wrap">
      <div class="row-grid" id="rowGrid"></div>
    </div>
  </div>

  <dl class="stats">
    <div class="stat">
      <dt>뜬 단수/총 단수</dt>
      <dd>
        <span id="rows">0</span> /
        <input type="number" id="target" value="20" min="1" max="999" required />
      </dd>
    </div>
    <div class="stat">
      <dt>쓴 볼 수/보유 볼 수</dt>
      <dd>
        <button id="ballMinus" type="button" aria-label="쓴 볼 수 줄이기">−</button>
        <span id="usedBall">0</span>
        <button id="ballPlus" type="button" aria-label="쓴 볼 수 늘리기">+</button>
        /
        <input type="number" id="totalBall" min="0" max="999" placeholder="-" />
      </dd>
    </div>
  </dl>

  <div class="controls">
    <button id="add">🧶 한 단 떴어요</button>
    <button id="rip">✂️ 한 단 풀기</button>
    <button id="wind">🧵 실 감기</button>
    <button id="swap" type="button">🎨 실 색 바꾸기</button>
    <button id="notesToggle" type="button">🔔 알림</button>
    <button id="wear" hidden>🧣 입어보기</button>
    <button id="reset" type="button">🔁 새로 뜨기</button>
  </div>

  <div class="stash" id="stash" hidden>
    <p class="hint">🎨 새로 쓸 실 색을 골라주세요</p>
    <div class="stash-grid" id="stashGrid"></div>
  </div>

  <div class="notes" id="notesPanel" hidden>
    <p class="hint">🔔 특정 단이나 몇 단마다 알려줄 알림을 만들어보세요</p>
    <ul class="notes-list" id="notesList"></ul>
    <form id="noteForm" class="note-form">
      <div class="note-type">
        <label><input type="radio" name="noteType" value="row" checked /> 특정 단</label>
        <label><input type="radio" name="noteType" value="every" /> 매 N단</label>
      </div>
      <div class="note-fields">
        <input type="number" id="noteNumber" min="1" max="999" placeholder="단수" required />
        <input type="text" id="noteMessage" maxlength="40" placeholder="알림 (예: 코 줄임)" required />
      </div>
      <div class="note-fields note-range" id="noteRange" hidden>
        <input type="number" id="noteFrom" min="1" max="999" placeholder="시작 단(기본 1)" />
        <span class="note-range-sep">~</span>
        <input type="number" id="noteTo" min="1" max="999" placeholder="끝 단(기본 총 단수)" />
      </div>
      <div class="note-presets">
        <button type="button" class="preset" data-msg="코 줄임">코 줄임</button>
        <button type="button" class="preset" data-msg="코 늘림">코 늘림</button>
        <button type="button" class="preset" data-msg="꽈배기">꽈배기</button>
        <button type="button" class="preset" data-msg="실 색 바꾸기">실 색 바꾸기</button>
      </div>
      <div class="note-actions">
        <button type="submit" id="noteSubmit">추가</button>
        <button type="button" id="noteCancel" hidden>취소</button>
      </div>
    </form>
  </div>
</main>

<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <p class="hint">스페이스바로 한 단 추가, 백스페이스로 한 단 풀기, W로 실 감기</p>
    <p class="hint">진행 상황은 이 브라우저에만 저장돼요. 다른 기기에서는 이어지지 않아요.</p>
    <footer>
